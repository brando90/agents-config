# Shared with Cursor. Inside Herdr these operate on its panes, not Ghostty surfaces.
# Ghostty translates macOS chords into Herdr's existing Control+B commands.
# Outside Herdr these emit Control+B plus a character; use a separate terminal
# profile if you need native Ghostty splits with these same chords.
keybind = ctrl+super+down=text:\x02-
keybind = ctrl+super+right=text:\x02v
keybind = ctrl+super+alt+left=text:\x02h
keybind = ctrl+super+alt+down=text:\x02j
keybind = ctrl+super+alt+up=text:\x02k
keybind = ctrl+super+alt+right=text:\x02l
