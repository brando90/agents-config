# TLDR: On each push to a codex/* or claude/* branch, comment [PUSH] in this repo's agent inbox issue (commits,
# SYNC.md diff, conflicts) and @mention Brando, so GitHub's notification email wakes ultimate_brando9 (Rule 71).
# Template: copy it unchanged to .github/workflows/agent-sync-ping.yml on the default branch of each repo that uses it
# (workflows/agent-sync.md in brando90/agents-config). Brando's account commits it: the assistant's app can't write workflows.
name: agent-sync-ping

on:
  push:
    branches: ['codex/**', 'claude/**']

permissions:
  contents: read
  issues: write

concurrency:
  group: agent-sync-ping-${{ github.ref }}

jobs:
  ping:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Comment in the agent inbox
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          DEFAULT: ${{ github.event.repository.default_branch }}
          PUSHER: ${{ github.event.pusher.name }}
          COMPARE: ${{ github.event.compare }}
          INBOX: ${{ vars.AGENT_INBOX_ISSUE }}
          NOTIFY: ${{ vars.AGENT_INBOX_NOTIFY || 'brando90' }}
        run: |
          set -euo pipefail
          if [ "$REPO" = "brando90/agents-config" ]; then
            script=scripts/agent_sync.py
          else
            script="$RUNNER_TEMP/agent_sync.py"
            curl -fsSL https://raw.githubusercontent.com/brando90/agents-config/main/scripts/agent_sync.py -o "$script"
          fi
          if [ -z "$INBOX" ]; then
            INBOX=$(gh issue list -R "$REPO" --state open --search 'in:title "Agent inbox"' --json number,title \
              --jq '[.[] | select(.title | startswith("Agent inbox"))][0].number // empty')
          fi
          if [ -z "$INBOX" ]; then
            echo "::warning::No open issue titled 'Agent inbox...' in $REPO; nothing posted."
            exit 0
          fi
          python3 "$script" ping-body --repo . --repo-name "$REPO" --branch "$BRANCH" --before "$BEFORE" \
            --after "$AFTER" --default-branch "$DEFAULT" --pusher "$PUSHER" --compare-url "$COMPARE" \
            --notify "$NOTIFY" > "$RUNNER_TEMP/body.md"
          gh issue comment "$INBOX" -R "$REPO" --body-file "$RUNNER_TEMP/body.md"
